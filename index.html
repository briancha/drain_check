<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1113">
<title>배수구 막힘 판별</title>
<style>
/*
VOICE: 현장용 계측기. 짧고 단호한 문장.
IDEA: 빗물받이 덮개 위에 대는 휴대용 측정기 화면.
PICTURE: 실시간 카메라 + 가이드 사각형 + 인식된 덮개(초록)와 덮인 부분(빨강).
COLOUR and TYPE: 검은 화면, 상태색(초록·호박·빨강)만 강조. 시스템 한글 글꼴.
LAYOUT: 위 카메라(화면 대부분), 아래 큰 퍼센트·슬라이더·버튼.
*/
:root{color-scheme:dark;--bg:#0e1113;--panel:#171b1e;--line:#2a3034;--ink:#eef1f2;--mute:#9aa3a8;--ok:#3ccf7a;--warn:#f2b632;--bad:#ff5a4f;--st:#9aa3a8}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
header h1{font-size:17px;margin:0;font-weight:700}
#fps{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1 1 auto;min-height:220px;background:#000;overflow:hidden;touch-action:none}
#stage video,#stage #photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#photo{display:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;padding:0 16px}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1c2328,#050607)}
#start p{margin:0;color:var(--mute);max-width:30em;font-size:15px}
#start .grate{width:120px;height:120px;border-radius:10px;background:repeating-linear-gradient(90deg,#5d6266 0 9px,#121416 9px 20px);box-shadow:inset 0 0 0 6px #3a3f43,0 10px 30px #0008}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px}
.read{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.big{font-size:clamp(44px,13vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--st)}
.big small{font-size:.45em;font-weight:700;margin-left:2px}
.lab{font-size:13px;color:var(--mute)}
#status{font-size:20px;font-weight:800;color:var(--st);text-align:right}
#detail{font-size:13px;color:var(--mute);text-align:right}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 20%,var(--warn) 20% 50%,var(--bad) 50% 100%);opacity:.9}
.meter i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #0009;left:0;transform:translateX(-2px);transition:left .15s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.ticks{position:relative;height:16px;font-size:12px;color:var(--mute);margin-top:-6px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.sl{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3.2em;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;height:32px;accent-color:#7cc4ff}
.btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
button,.file{position:relative;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#20262a;color:var(--ink);font-family:inherit;font-weight:600;font-size:14px;line-height:1.2;padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
button.primary{background:var(--ink);color:#0e1113;border-color:var(--ink);font-size:16px;padding:12px 22px;min-height:50px}
button:focus-visible,.file:focus-within,input:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
button[aria-pressed=true]{background:#2f3a40;border-color:#55636b}
.file input{position:absolute;width:1px;height:1px;opacity:0}
#msg{font-size:13px;color:var(--warn)}
#msg:empty{display:none}
.note{font-size:12px;color:var(--mute);margin:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (min-width:900px){body{flex-direction:row;flex-wrap:wrap}header{width:100%}#stage{flex:1 1 60%;height:calc(100% - 50px)}.panel{width:380px;border-top:0;border-left:1px solid var(--line);align-content:start}}
</style>
</head>
<body>
<header><h1>배수구 막힘 판별</h1><span id="fps">모델 준비 중</span></header>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="photo"></canvas>
  <canvas id="ov"></canvas>
  <div id="hint"></div>
  <div id="start">
    <div class="grate" aria-hidden="true"></div>
    <p>빗물받이 덮개를 화면의 사각형 안에 넣으면, 덮개 면적의 몇 %가 낙엽·쓰레기·흙 등으로 덮였는지 실시간으로 보여줘요. 멀리서는 아래 슬라이더로 사각형을 덮개 크기에 맞춰 주세요.</p>
    <button class="primary" id="go">카메라 켜기</button>
    <label class="file" style="border:0;background:none;color:var(--mute);min-height:44px">또는 사진으로 테스트<input type="file" accept="image/*" id="file2"></label>
  </div>
</div>

<section class="panel">
  <div class="read" aria-live="polite">
    <div><div class="lab">덮인 비율</div><div class="big" id="pct">–<small>%</small></div></div>
    <div><div id="status">대기 중</div><div id="detail">카메라를 켜 주세요</div></div>
  </div>
  <div class="meter"><i id="needle"></i></div>
  <div class="ticks"><span style="left:0">0</span><span style="left:20%">20</span><span style="left:50%">50</span><span style="left:100%">100%</span></div>
  <label class="sl">사각형 크기<input type="range" id="boxr" min="25" max="95" step="1" value="70"><output id="boxv">70%</output></label>
  <label class="sl" id="zoomrow" hidden>카메라 줌<input type="range" id="zoomr"><output id="zoomv">1.0×</output></label>
  <div class="btns">
    <button id="cam" aria-pressed="false">카메라</button>
    <button id="heat" aria-pressed="true">표시</button>
    <button id="save">화면 저장</button>
    <label class="file">사진 테스트<input type="file" accept="image/*" id="file"></label>
  </div>
  <div class="legend"><span><i style="background:#3ccf7a"></i>인식된 덮개</span><span><i style="background:#ff5a4f"></i>덮인 부분</span></div>
  <div id="msg"></div>
  <p class="note">합성 이미지로 학습한 시험판이에요. 덮개 위에 보이는 이물질만 판단하고, 관 내부 막힘은 알 수 없어요.</p>
</section>

<script id="engine-src" type="text/plain">
// Tiny CNN forward pass in plain JS (weights exported from PyTorch with BatchNorm folded).
// Input: Float32Array CHW 3x96x96 (values = rgb/255 - 0.5). Output: Float32Array 24x24 probabilities.
function b64ToF32(s) {
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}

function conv(inp, C, H, W, L, relu) {
  const { o: O, k, s, d, w, b } = L;
  const p = d * (k >> 1);
  const Ho = Math.floor((H + 2 * p - d * (k - 1) - 1) / s) + 1;
  const Wo = Math.floor((W + 2 * p - d * (k - 1) - 1) / s) + 1;
  const out = new Float32Array(O * Ho * Wo);
  for (let o = 0; o < O; o++) {
    const ob = o * Ho * Wo, bias = b[o];
    for (let i = 0; i < Ho * Wo; i++) out[ob + i] = bias;
    for (let c = 0; c < C; c++) {
      const ib = c * H * W;
      for (let ky = 0; ky < k; ky++) {
        for (let kx = 0; kx < k; kx++) {
          const wv = w[((o * C + c) * k + ky) * k + kx];
          if (wv === 0) continue;
          const dy = ky * d - p, dx = kx * d - p;
          // valid output x range: 0 <= x*s+dx < W
          const x0 = Math.max(0, Math.ceil(-dx / s)), x1 = Math.min(Wo, Math.floor((W - 1 - dx) / s) + 1);
          for (let y = 0; y < Ho; y++) {
            const iy = y * s + dy;
            if (iy < 0 || iy >= H) continue;
            const orow = ob + y * Wo, irow = ib + iy * W + dx;
            if (s === 1) {
              for (let x = x0; x < x1; x++) out[orow + x] += wv * inp[irow + x];
            } else {
              for (let x = x0; x < x1; x++) out[orow + x] += wv * inp[irow + x * s];
            }
          }
        }
      }
    }
    if (relu) for (let i = 0; i < Ho * Wo; i++) if (out[ob + i] < 0) out[ob + i] = 0;
  }
  return { t: out, C: O, H: Ho, W: Wo };
}

function up2(t, C, H, W) { // bilinear x2, align_corners=false (PyTorch semantics)
  const Ho = H * 2, Wo = W * 2, out = new Float32Array(C * Ho * Wo);
  const map = (dst, n) => {
    let src = (dst + 0.5) / 2 - 0.5; if (src < 0) src = 0;
    const i0 = Math.floor(src), i1 = Math.min(i0 + 1, n - 1), f = src - i0;
    return [i0, i1, f];
  };
  const ym = [], xm = [];
  for (let y = 0; y < Ho; y++) ym.push(map(y, H));
  for (let x = 0; x < Wo; x++) xm.push(map(x, W));
  for (let c = 0; c < C; c++) {
    const b = c * H * W, ob = c * Ho * Wo;
    for (let y = 0; y < Ho; y++) {
      const [y0, y1, fy] = ym[y];
      for (let x = 0; x < Wo; x++) {
        const [x0, x1, fx] = xm[x];
        const a = t[b + y0 * W + x0], bb = t[b + y0 * W + x1], cc = t[b + y1 * W + x0], dd = t[b + y1 * W + x1];
        out[ob + y * Wo + x] = (a * (1 - fx) + bb * fx) * (1 - fy) + (cc * (1 - fx) + dd * fx) * fy;
      }
    }
  }
  return out;
}

function createNet(model) {
  const L = {};
  for (const [name, l] of Object.entries(model.layers)) L[name] = { ...l, w: b64ToF32(l.w), b: b64ToF32(l.b) };
  const N = model.input;
  const cat = (a, b) => { const o = new Float32Array(a.t.length + b.t.length); o.set(a.t, 0); o.set(b.t, a.t.length); return { t: o, C: a.C + b.C, H: b.H, W: b.W }; };
  const up = (a) => ({ t: up2(a.t, a.C, a.H, a.W), C: a.C, H: a.H * 2, W: a.W * 2 });
  const cv = (a, name, relu = true) => conv(a.t, a.C, a.H, a.W, L[name], relu);
  return {
    input: N,
    grid: N / 4,
    // x: Float32Array 3xNxN. Returns Float32Array 3xGxG softmax (bg, open, covered)
    run(x) {
      const s32 = cv(cv(cv({ t: x, C: 3, H: N, W: N }, "c1"), "c2"), "c3");
      const s16 = cv(cv(s32, "c4"), "c5");
      let y = cv(cv(s16, "c6"), "c7");
      y = cv(cv(cat(up(y), s16), "c8"), "c9");
      y = cv(cv(cat(up(y), s32), "c10"), "c11");
      const z = cv(y, "out", false), P = z.H * z.W, p = z.t;
      for (let i = 0; i < P; i++) {
        const a = p[i], b = p[P + i], c = p[2 * P + i], m = Math.max(a, b, c);
        const ea = Math.exp(a - m), eb = Math.exp(b - m), ec = Math.exp(c - m), s = ea + eb + ec;
        p[i] = ea / s; p[P + i] = eb / s; p[2 * P + i] = ec / s;
      }
      return p;
    }
  };
}
if (typeof module !== "undefined") module.exports = { createNet };

<script>
{
const $ = (id) => document.getElementById(id);
const video = $("video"), photo = $("photo"), ov = $("ov"), stage = $("stage");
const ENGINE = $("engine-src").textContent, MODEL_TXT = $("model-src").textContent;
const N = JSON.parse(MODEL_TXT).input, G = N / 4, P = G * G;
let BOX = 0.70;
try { const v = parseFloat(localStorage.getItem("drainBox")); if (v >= 0.25 && v <= 0.95) BOX = v; } catch (e) {}
$("boxr").value = Math.round(BOX * 100); $("boxv").textContent = Math.round(BOX * 100) + "%";

// ---- inference: Web Worker when possible, main thread otherwise
let worker = null, mainNet = null, pending = null;
try {
  const src = ENGINE + "\nconst MODEL=" + MODEL_TXT + ";const net=createNet(MODEL);" +
    "onmessage=(e)=>{const p=net.run(new Float32Array(e.data));postMessage(p.buffer,[p.buffer]);};";
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
  worker.onmessage = (e) => { const r = pending; pending = null; r && r(new Float32Array(e.data)); };
  worker.onerror = () => { worker = null; };
} catch (e) { worker = null; }
function getMainNet() {
  if (!mainNet) { (0, eval)(ENGINE); mainNet = createNet(JSON.parse(MODEL_TXT)); }
  return mainNet;
}
function infer(input) {
  if (worker) return new Promise((res) => { pending = res; worker.postMessage(input.buffer, [input.buffer]); });
  return Promise.resolve(getMainNet().run(input));
}

// ---- progressive downscale (prevents the fine slot pattern from aliasing)
const pyr = [];
function canvasAt(i, size) {
  if (!pyr[i]) { const c = document.createElement("canvas"); pyr[i] = { c, x: c.getContext("2d", { willReadFrequently: i === 0 }) }; }
  if (pyr[i].c.width !== size) { pyr[i].c.width = pyr[i].c.height = size; }
  pyr[i].x.imageSmoothingEnabled = true; pyr[i].x.imageSmoothingQuality = "high";
  return pyr[i];
}
function grab(s, g) {
  const sizes = [N];
  while (sizes[sizes.length - 1] * 2 < g.side) sizes.push(sizes[sizes.length - 1] * 2);
  let k = sizes.length - 1, top = canvasAt(k, sizes[k]);
  top.x.drawImage(s.el, g.sx, g.sy, g.side, g.side, 0, 0, sizes[k], sizes[k]);
  for (k--; k >= 0; k--) { const c = canvasAt(k, sizes[k]); c.x.drawImage(pyr[k + 1].c, 0, 0, sizes[k], sizes[k]); }
  const d = pyr[0].x.getImageData(0, 0, N, N).data, NN = N * N, input = new Float32Array(3 * NN);
  for (let i = 0; i < NN; i++) {
    input[i] = d[i * 4] / 255 - 0.5; input[NN + i] = d[i * 4 + 1] / 255 - 0.5; input[2 * NN + i] = d[i * 4 + 2] / 255 - 0.5;
  }
  return input;
}

// ---- geometry
let stream = null, track = null, mode = "idle", showHeat = true, busy = false, photoSrc = null;
const ema = new Float32Array(3 * P); let emaInit = false, covEma = null;
let nDone = 0, tFps = performance.now();
function srcInfo() {
  if (mode === "camera") return { el: video, w: video.videoWidth, h: video.videoHeight };
  if (mode === "photo") return { el: photoSrc, w: photoSrc.width, h: photoSrc.height };
  return null;
}
function geometry(s) {
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const sc = Math.max(cw / s.w, ch / s.h);
  const ox = (cw - s.w * sc) / 2, oy = (ch - s.h * sc) / 2;
  const visW = Math.min(s.w, cw / sc), visH = Math.min(s.h, ch / sc);
  const side = BOX * Math.min(visW, visH);
  const sx = (s.w - side) / 2, sy = (s.h - side) / 2;
  return { sx, sy, side, dx: ox + sx * sc, dy: oy + sy * sc, dside: side * sc, cw, ch };
}

function level(c) {
  if (c === null) return { name: "덮개 찾는 중", detail: "덮개가 사각형 안에 들어오게 비춰 주세요", col: "var(--mute)", hex: "#ffffff" };
  if (c < 20) return { name: "정상", detail: "물이 잘 빠질 상태예요", col: "var(--ok)", hex: "#3ccf7a" };
  if (c < 50) return { name: "일부 막힘", detail: "청소가 필요할 수 있어요", col: "var(--warn)", hex: "#f2b632" };
  return { name: "막힘", detail: "청소가 필요해요", col: "var(--bad)", hex: "#ff5a4f" };
}
let lv = level(null), grateFrac = 0;
function update(p, alpha) {
  if (!emaInit || alpha === 1) { ema.set(p); emaInit = true; }
  else for (let i = 0; i < ema.length; i++) ema[i] = alpha * p[i] + (1 - alpha) * ema[i];
  let so = 0, scv = 0;
  for (let i = 0; i < P; i++) { so += ema[P + i]; scv += ema[2 * P + i]; }
  grateFrac = (so + scv) / P;
  const cov = grateFrac < 0.08 ? null : (scv / (so + scv)) * 100;
  covEma = cov;
  lv = level(cov);
  document.documentElement.style.setProperty("--st", lv.col);
  $("pct").firstChild.nodeValue = cov === null ? "–" : Math.round(cov);
  $("status").textContent = lv.name;
  $("detail").textContent = cov === null ? lv.detail : `${lv.detail} · 덮개 인식 ${Math.round(grateFrac * 100)}%`;
  $("needle").style.left = (cov === null ? 0 : Math.min(100, Math.max(0, cov))) + "%";
}

const heatC = document.createElement("canvas"); heatC.width = heatC.height = G;
const hctx = heatC.getContext("2d"), heatImg = hctx.createImageData(G, G);
function draw() {
  const s = srcInfo(); if (!s || !s.w) return;
  const g = geometry(s), dpr = window.devicePixelRatio || 1;
  if (ov.width !== Math.round(g.cw * dpr) || ov.height !== Math.round(g.ch * dpr)) { ov.width = Math.round(g.cw * dpr); ov.height = Math.round(g.ch * dpr); }
  const c = ov.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, g.cw, g.ch);
  c.fillStyle = "rgba(0,0,0,.45)";
  c.beginPath(); c.rect(0, 0, g.cw, g.ch); c.rect(g.dx, g.dy, g.dside, g.dside); c.fill("evenodd");
  if (showHeat && emaInit) {
    const d = heatImg.data;
    for (let i = 0; i < P; i++) {
      const po = ema[P + i], pc = ema[2 * P + i];
      if (pc >= po) { d[i * 4] = 255; d[i * 4 + 1] = 60; d[i * 4 + 2] = 45; d[i * 4 + 3] = Math.min(220, 230 * pc); }
      else { d[i * 4] = 60; d[i * 4 + 1] = 210; d[i * 4 + 2] = 120; d[i * 4 + 3] = 95 * po; }
    }
    hctx.putImageData(heatImg, 0, 0);
    c.imageSmoothingEnabled = true;
    c.drawImage(heatC, g.dx, g.dy, g.dside, g.dside);
  }
  const L = g.dside * 0.16, x0 = g.dx, y0 = g.dy, x1 = g.dx + g.dside, y1 = g.dy + g.dside;
  c.strokeStyle = lv.hex; c.lineWidth = 4; c.lineCap = "round";
  c.beginPath();
  c.moveTo(x0, y0 + L); c.lineTo(x0, y0); c.lineTo(x0 + L, y0);
  c.moveTo(x1 - L, y0); c.lineTo(x1, y0); c.lineTo(x1, y0 + L);
  c.moveTo(x1, y1 - L); c.lineTo(x1, y1); c.lineTo(x1 - L, y1);
  c.moveTo(x0 + L, y1); c.lineTo(x0, y1); c.lineTo(x0, y1 - L);
  c.stroke();
}

async function runOnce(alpha) {
  const s = srcInfo(); if (!s || !s.w || busy) return;
  busy = true;
  try { const p = await infer(grab(s, geometry(s))); if (mode !== "idle") update(p, alpha); nDone++; }
  finally { busy = false; }
}
function loop() {
  if (mode !== "camera") return;
  if (video.readyState >= 2 && !busy) runOnce(0.4);
  draw();
  const now = performance.now();
  if (now - tFps > 1000) { $("fps").textContent = `판별 ${(nDone * 1000 / (now - tFps)).toFixed(1)}회/초`; nDone = 0; tFps = now; }
  requestAnimationFrame(loop);
}

function msg(t) { $("msg").textContent = t || ""; }
async function startCamera() {
  msg("");
  if (!window.isSecureContext) { msg("카메라는 https 주소(또는 PC에서 파일로 연 경우)에서만 켜져요."); return; }
  if (!navigator.mediaDevices?.getUserMedia) { msg("이 브라우저는 카메라를 지원하지 않아요. Chrome이나 Safari 최신 버전을 써 주세요."); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    msg(e.name === "NotAllowedError" ? "카메라 권한이 거부됐어요. 주소창의 권한 설정에서 카메라를 허용해 주세요." : "카메라를 켜지 못했어요: " + e.name);
    return;
  }
  video.srcObject = stream; track = stream.getVideoTracks()[0];
  try { await video.play(); } catch (e) {}
  setupZoom();
  photo.style.display = "none"; video.style.display = "block"; $("start").style.display = "none";
  mode = "camera"; emaInit = false;
  $("cam").setAttribute("aria-pressed", "true"); $("cam").textContent = "카메라 끄기";
  $("hint").textContent = "덮개가 사각형 안에 들어오게 · 멀면 사각형을 줄이세요";
  requestAnimationFrame(loop);
}
function setupZoom() {
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};

  if (!caps.zoom) { row.hidden = true; return; }
  r.min = caps.zoom.min; r.max = caps.zoom.max; r.step = caps.zoom.step || 0.1;
  r.value = (track.getSettings().zoom) || caps.zoom.min;
  $("zoomv").textContent = (+r.value).toFixed(1) + "×";
  row.hidden = false;
}
$("zoomr").oninput = (e) => {
  const v = +e.target.value; $("zoomv").textContent = v.toFixed(1) + "×";
  track && track.applyConstraints({ advanced: [{ zoom: v }] }).catch(() => {});
};
$("boxr").oninput = (e) => {
  BOX = e.target.value / 100; $("boxv").textContent = e.target.value + "%";
  try { localStorage.setItem("drainBox", String(BOX)); } catch (err) {}
  if (mode === "photo") runOnce(1).then(draw);
};
function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; track = null; video.srcObject = null; $("zoomrow").hidden = true;
  if (mode === "camera") mode = "idle";
  $("cam").setAttribute("aria-pressed", "false"); $("cam").textContent = "카메라";
  $("fps").textContent = "정지됨";
}
async function loadPhoto(file) {
  if (!file) return;
  stopCamera(); msg("");
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) { msg("사진을 열지 못했어요."); return; }
  photoSrc = bmp; photo.width = bmp.width; photo.height = bmp.height;
  photo.getContext("2d").drawImage(bmp, 0, 0);
  video.style.display = "none"; photo.style.display = "block"; $("start").style.display = "none";
  mode = "photo"; emaInit = false;
  await runOnce(1); draw();
  $("fps").textContent = "사진 판별";
  $("hint").textContent = "사각형 크기를 바꾸면 다시 판별해요";
}
$("go").onclick = startCamera;
$("cam").onclick = () => (stream ? stopCamera() : startCamera());
$("heat").onclick = () => { showHeat = !showHeat; $("heat").setAttribute("aria-pressed", String(showHeat)); draw(); };
$("file").onchange = (e) => loadPhoto(e.target.files[0]);
$("file2").onchange = (e) => loadPhoto(e.target.files[0]);
$("save").onclick = () => {
  const s = srcInfo();
  if (!s || !s.w) { msg("먼저 카메라를 켜거나 사진을 불러와 주세요."); return; }
  const g = geometry(s), out = document.createElement("canvas");
  out.width = out.height = Math.min(768, Math.round(g.side));
  const x = out.getContext("2d"); x.imageSmoothingQuality = "high";
  x.drawImage(s.el, g.sx, g.sy, g.side, g.side, 0, 0, out.width, out.height);
  const pct = covEma === null ? "na" : Math.round(covEma) + "pct";
  const ts = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14), name = `drain_${ts}_${pct}.jpg`;
  out.toBlob((b) => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg("저장했어요: " + name);
  }, "image/jpeg", 0.92);
};
window.addEventListener("resize", () => { if (mode === "photo") draw(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && stream) stopCamera(); });
$("fps").textContent = worker ? "모델 준비 완료" : "모델 준비 완료 (기본 모드)";
}
</script>
</body>
